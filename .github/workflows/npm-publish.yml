name: npm publish

# Publishes the one package a release names. release-please cuts a release per package
# (tags resource/v* and resource-angular/v*); this workflow builds the tagged commit and
# publishes that package's dist folder to npm. The manual trigger re-publishes a tag after a
# fixed registry setting.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, e.g. resource/v0.0.1'
        required: true
        type: string

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Resolve the package from the tag
        id: package
        run: |
          case "$TAG" in
            resource/v*)         echo "name=resource"         >> "$GITHUB_OUTPUT" ;;
            resource-angular/v*) echo "name=resource-angular" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::'$TAG' is not a package release tag (resource/v* or resource-angular/v*)"; exit 1 ;;
          esac
          echo "version=${TAG#*/v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # a release build installs from the lockfile, never from a cache
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - run: bun run build

      - name: The built manifest carries the released version
        run: |
          built=$(node -p "require('./dist/${{ steps.package.outputs.name }}/package.json').version")
          if [ "$built" != "${{ steps.package.outputs.version }}" ]; then
            echo "::error::dist/${{ steps.package.outputs.name }} is $built, the tag says ${{ steps.package.outputs.version }}"
            exit 1
          fi

      # Authentication is OIDC trusted publishing: each package's settings on npmjs.com name this
      # workflow file as a trusted publisher, and npm exchanges the job's identity token for a
      # short-lived publish credential. A package name that does not exist yet cannot be created
      # this way (nor by a token or a staged publish): its first version is published by a person
      # with two-factor authentication, and this workflow takes over from the second version.
      - run: npm publish --access public --provenance
        working-directory: ./dist/${{ steps.package.outputs.name }}
